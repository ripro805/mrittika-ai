# Pyrefly Configuration for Mrittika AI
python-version = "3.14"

# Search paths for module resolution
search-paths = [
    "backend",
    "backend/apps",
]

# Silence missing type stub warnings for third-party libraries
replace-untyped-imports-with-any = [
    "django",
    "django.*",
    "rest_framework",
    "rest_framework.*",
    "drf_spectacular",
    "drf_spectacular.*",
    "sklearn",
    "sklearn.*",
    "joblib",
    "joblib.*",
    "reportlab",
    "reportlab.*",
]

[errors]
untyped-import = "ignore"
